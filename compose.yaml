services:
  noma-web:
    build:
      context: ./noma-web
      args:
        NODE_IMAGE: ${NOMA_DEV_NODE_IMAGE:-node:22-alpine}
    restart: unless-stopped
    init: true
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./noma-web:/app
      - noma_web_node_modules:/app/node_modules
      - noma_web_next:/app/.next
    expose: ["3000"]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
  noma-local:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      - noma-web
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - noma_local_data:/data
      - ./cmd:/src/cmd
      - ./internal:/src/internal
      - ./go.mod:/src/go.mod
    environment:
      NOMA_LOCAL_ADDR: 0.0.0.0:3000
      NOMA_WEB_URL: http://noma-web:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  noma_local_data:
  noma_web_node_modules:
  noma_web_next:
